# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - containers(mautic)

on:
  push:
    branches:
      - 6.x
  workflow_dispatch:

jobs:
  build:
    runs-on: 'ubuntu-latest'

    steps:
    - uses: actions/checkout@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to registry
      uses: docker/login-action@v2
      with:
        registry: https://db92c468e5bc472592f52e70fa9b4774.azurecr.io/
        username: ${{ secrets.AzureAppService_ContainerUsername_83d7101f483c4952986d74a04ff141b9 }}
        password: ${{ secrets.AzureAppService_ContainerPassword_3e7daaaf65bd43fe9adc20368d34ba32 }}

    - name: Build and push container image to registry
      uses: docker/build-push-action@v3
      with:
        push: true
        tags: db92c468e5bc472592f52e70fa9b4774.azurecr.io/${{ secrets.AzureAppService_ContainerUsername_83d7101f483c4952986d74a04ff141b9 }}/db92c468e5bc472592f52e70fa9b4774/db92c468e5bc472592f52e70fa9b4774/azureml/azureml_ae9b088a130efdab38ad8f2224c5626f:${{ github.sha }}
        file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'mautic'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
    - name: Deploy to Azure Web App
      id: deploy-to-webapp
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'containers'
        slot-name: 'mautic'
        publish-profile: ${{ secrets.AzureAppService_PublishProfile_4f74c3704df34aa7bb22e09a65d35fa8 }}
        images: 'db92c468e5bc472592f52e70fa9b4774.azurecr.io/${{ secrets.AzureAppService_ContainerUsername_83d7101f483c4952986d74a04ff141b9 }}/db92c468e5bc472592f52e70fa9b4774/db92c468e5bc472592f52e70fa9b4774/azureml/azureml_ae9b088a130efdab38ad8f2224c5626f:${{ github.sha }}'